<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071944">
  <title>You're offline · NEET BEE</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 24px; display: grid; place-items: center; background: #f4faff; color: #081841; font: 600 16px/1.5 Arial, sans-serif; text-align: center; }
    main { max-width: 440px; padding: 36px; border: 1px solid #dce8fa; border-radius: 20px; background: white; box-shadow: 0 12px 32px #1d243314; }
    img { width: 88px; height: 88px; }
    h1 { margin: 18px 0 8px; font-size: 24px; }
    p { margin: 0 0 24px; color: #506184; }
    button { border: 0; border-radius: 12px; padding: 12px 22px; background: #0ac6f0; color: #052a36; font: inherit; font-weight: 800; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/img/pwa-icon.svg" alt="">
    <h1>You're offline</h1>
    <p>Reconnect to the internet to continue using NEET BEE.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
